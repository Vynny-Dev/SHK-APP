  <body class="bg-[#0c0914] text-[#f5f2fc] antialiased selection:bg-[#e8c88a]/30 selection:text-[#fef0ce]">
    <div id="root"></div>

    <script>
    // ============================================================
    // SHEKINAH CUSTOMIZATIONS — injected via DOM observer
    // Safe injection: does NOT modify the compiled React bundle.
    // ============================================================
    (function() {

      // --- Helpers ---

      function calcLevel(points) {
        points = points || 0;
        if (points >= 1200) return { level: 5, name: 'Apóstolo do Primeiro Amor', badge: '🔥' };
        if (points >= 750)  return { level: 4, name: 'Guardião do Altar',          badge: '🛡️' };
        if (points >= 400)  return { level: 3, name: 'Intercessor de Fogo',         badge: '⚡' };
        if (points >= 150)  return { level: 2, name: 'Sentinela da Oração',         badge: '🌙' };
        return               { level: 1, name: 'Buscador da Presença',              badge: '🌱' };
      }

      function getCurrentUser() {
        try {
          var raw = localStorage.getItem('shekinah_current_user');
          return raw ? JSON.parse(raw) : null;
        } catch(e) { return null; }
      }

      var LEVEL_BADGE_ID   = 'shk-level-badge';
      var VISITOR_BADGE_ID = 'shk-visitor-badge';

      // Keep track of the last known login state to detect changes
      var _lastUserId = undefined;

      // Remove ALL our injected badges (header + chat)
      function cleanupInjections() {
        var lvlBadge = document.getElementById(LEVEL_BADGE_ID);
        if (lvlBadge) lvlBadge.parentElement && lvlBadge.parentElement.removeChild(lvlBadge);

        var visBadge = document.getElementById(VISITOR_BADGE_ID);
        if (visBadge) visBadge.parentElement && visBadge.parentElement.removeChild(visBadge);

        // Restore hidden pills in header
        var pills = document.querySelectorAll('header [class*="rounded-full"]');
        for (var p = 0; p < pills.length; p++) {
          pills[p].style.display = '';
        }

        // Remove chat masking flags so rows get re-processed
        var masked = document.querySelectorAll('[data-shk-masked]');
        for (var m = 0; m < masked.length; m++) {
          masked[m].removeAttribute('data-shk-masked');
        }

        // Remove blur from any chat avatars / names previously blurred
        var blurred = document.querySelectorAll('[data-shk-blurred]');
        for (var b = 0; b < blurred.length; b++) {
          blurred[b].style.filter = '';
          blurred[b].style.userSelect = '';
          blurred[b].removeAttribute('data-shk-blurred');
        }

        // Restore hidden age/title spans
        var hidden = document.querySelectorAll('[data-shk-hidden]');
        for (var h = 0; h < hidden.length; h++) {
          hidden[h].style.display = '';
          hidden[h].removeAttribute('data-shk-hidden');
        }
      }

      // ------------------------------------------------------------------
      // 1. INJECT LEVEL BADGE next to the points counter in the header
      // ------------------------------------------------------------------
      function injectLevelBadge() {
        var user = getCurrentUser();

        // Already have the right badge?
        if (user  && document.getElementById(LEVEL_BADGE_ID))   return;
        if (!user && document.getElementById(VISITOR_BADGE_ID)) return;

        // Find the pts span
        var allSpans = document.querySelectorAll('header span');
        var ptsSpan = null;
        for (var i = 0; i < allSpans.length; i++) {
          var txt = allSpans[i].textContent.trim();
          if (txt.endsWith(' pts') || txt === 'pts') { ptsSpan = allSpans[i]; break; }
        }
        if (!ptsSpan) return;

        var ptsPill = ptsSpan.closest('[class*="rounded-full"]');
        if (!ptsPill || !ptsPill.parentElement) return;

        if (user) {
          var lvl = calcLevel(user.points || 0);
          var badge = document.createElement('div');
          badge.id = LEVEL_BADGE_ID;
          badge.style.cssText = 'display:inline-flex;align-items:center;gap:3px;padding:2px 10px;border-radius:9999px;background:rgba(88,28,135,0.5);border:1px solid rgba(192,132,252,0.5);font-size:11px;font-weight:900;color:#e9d5ff;box-shadow:0 0 14px rgba(168,85,247,0.35);cursor:default;white-space:nowrap';
          badge.title = lvl.name;
          badge.innerHTML = '<span style="font-size:12px">' + lvl.badge + '</span><span>Nível ' + lvl.level + '</span>';
          ptsPill.parentElement.insertBefore(badge, ptsPill.nextSibling);

        } else {
          var vis = document.createElement('div');
          vis.id = VISITOR_BADGE_ID;
          vis.style.cssText = 'display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:9999px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);font-size:10px;color:#a197b8';
          vis.innerHTML = '<span style="width:6px;height:6px;border-radius:50%;background:rgba(251,191,36,0.6);display:inline-block"></span><span>Modo Visitante</span>';
          ptsPill.parentElement.insertBefore(vis, ptsPill.nextSibling);

          // Hide streak + pts pills for visitors
          var pills = ptsPill.parentElement.querySelectorAll('[class*="rounded-full"]');
          for (var p = 0; p < pills.length; p++) {
            if (pills[p].id !== VISITOR_BADGE_ID) {
              pills[p].style.display = 'none';
            }
          }
        }
      }

      // ------------------------------------------------------------------
      // 2. MASK CHAT MEMBER INFO for visitors
      // ------------------------------------------------------------------
      function maskChatForVisitor() {
        var user = getCurrentUser();
        if (user) return;

        var chatArea = document.querySelector('[class*="overflow-y-auto"][class*="space-y"]');
        if (!chatArea) return;

        var rows = chatArea.children;
        for (var r = 0; r < rows.length; r++) {
          var row = rows[r];
          if (row.getAttribute('data-shk-masked')) continue;

          var avatarBtn = row.querySelector('button');
          if (avatarBtn) {
            var img = avatarBtn.querySelector('img');
            if (img && !img.getAttribute('data-shk-blurred')) {
              img.style.filter = 'blur(8px)';
              img.setAttribute('data-shk-blurred', '1');
            }
            var initDiv = avatarBtn.querySelector('div');
            if (initDiv && !initDiv.getAttribute('data-shk-blurred')) {
              initDiv.style.filter = 'blur(8px)';
              initDiv.setAttribute('data-shk-blurred', '1');
            }
          }

          var contentDiv = row.querySelector('[class*="rounded-2xl"][class*="p-3"]');
          if (contentDiv) {
            var nameSpan = contentDiv.querySelector('span[class*="font-black"]');
            if (nameSpan && !nameSpan.getAttribute('data-shk-blurred')) {
              nameSpan.style.filter = 'blur(5px)';
              nameSpan.style.userSelect = 'none';
              nameSpan.setAttribute('data-shk-blurred', '1');
            }
            var agePills = contentDiv.querySelectorAll('span[class*="rounded-full"]');
            for (var ap = 0; ap < agePills.length; ap++) {
              if (!agePills[ap].getAttribute('data-shk-hidden')) {
                agePills[ap].style.display = 'none';
                agePills[ap].setAttribute('data-shk-hidden', '1');
              }
            }
            var titleSpans = contentDiv.querySelectorAll('span[class*="uppercase"]');
            for (var ts = 0; ts < titleSpans.length; ts++) {
              if (!titleSpans[ts].getAttribute('data-shk-hidden')) {
                titleSpans[ts].style.display = 'none';
                titleSpans[ts].setAttribute('data-shk-hidden', '1');
              }
            }
          }
          row.setAttribute('data-shk-masked', '1');
        }
      }

      // ------------------------------------------------------------------
      // 3. MAIN LOOP — detect login/logout state changes
      // ------------------------------------------------------------------
      function run() {
        var user = getCurrentUser();
        var userId = user ? user.id : null;

        // Detect login/logout transition → clean up and re-inject
        if (_lastUserId !== undefined && _lastUserId !== userId) {
          cleanupInjections();
        }
        _lastUserId = userId;

        injectLevelBadge();
        maskChatForVisitor();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() { setTimeout(run, 800); });
      } else {
        setTimeout(run, 800);
      }

      var observer = new MutationObserver(function() { run(); });
      observer.observe(document.body, { childList: true, subtree: true });

    })();
    </script>
  </body>
